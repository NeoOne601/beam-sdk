name: Beam SDK CI
on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install clang (required by pqcrypto-dilithium)
        run: sudo apt-get install -y clang libclang-dev
      - name: Install Android NDK r26
        run: sdkmanager "ndk;26.1.10909125"
      - name: Install TensorFlow Lite
        run: bash ci/install_tflite.sh
      - name: Build Rust core (aarch64-android)
        run: |
          export ANDROID_NDK="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
          export CC_aarch64_linux_android=aarch64-linux-android24-clang
          export CXX_aarch64_linux_android=aarch64-linux-android24-clang
          export AR_aarch64_linux_android=llvm-ar
          cargo build --release --target aarch64-linux-android
        working-directory: core
      - name: Create build output directory
        run: mkdir -p build_output
      - name: CMake configure and build
        run: |
          export ANDROID_NDK="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
          export CC_aarch64_linux_android=aarch64-linux-android24-clang
          export CXX_aarch64_linux_android=aarch64-linux-android24-clang
          export AR_aarch64_linux_android=llvm-ar
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DCMAKE_MODULE_PATH=../build \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DBEAM_TARGET=Android \
                ../build
          cmake --build . --config Release
        working-directory: build_output
      - name: Package AAR
        run: bash scripts/package_android_aar.sh

  ios-arm64:
    runs-on: macos-15
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build Rust core (iOS)
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
        working-directory: core
      - name: Build iOS XCFramework
        run: bash ci/ios_xcodebuild.sh
      - name: Package XCFramework
        run: bash scripts/package_ios_xcframework.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: "latest"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - name: Build WASM
        run: bash ci/wasm_emscripten.sh

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang (required by pqcrypto-dilithium)
        run: sudo apt-get install -y clang libclang-dev
      - name: Run all Rust tests
        run: cargo test --release
        working-directory: core
      - name: Run benchmarks (verify budget)
        run: cargo bench
        working-directory: core
