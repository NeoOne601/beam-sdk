name: Beam SDK CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ───────────────────────────────────────────
  # Rust Core — build, test, lint, bench
  # ───────────────────────────────────────────
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Format check
        run: cargo fmt --check -p beam-core
      - name: Clippy lint
        run: cargo clippy -p beam-core -- -D warnings
      - name: Unit tests
        run: cargo test --release -p beam-core
      - name: Benchmarks (dry run)
        run: cargo bench --bench pipeline_bench -p beam-core -- --test
      - name: Crypto benchmarks (dry run)
        run: cargo bench --bench crypto_bench -p beam-core -- --test

  # ───────────────────────────────────────────
  # Backend — build, test, lint
  # ───────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beam_verify_test
          POSTGRES_USER: beam
          POSTGRES_PASSWORD: beam
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://beam:beam@localhost:5432/beam_verify_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - name: Run migrations
        run: psql "$DATABASE_URL" -f backend/src/db/migrations/001_initial.sql
      - name: Format check
        run: cargo fmt --check -p beam-verify-backend
      - name: Clippy lint
        run: cargo clippy -p beam-verify-backend -- -D warnings -A unused
      - name: Unit tests
        run: cargo test --release -p beam-verify-backend

  # ───────────────────────────────────────────
  # Security — banned phrases, schema validation, cargo-audit
  # ───────────────────────────────────────────
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check banned security phrases
        run: |
          if grep -rni "fips certified\|fips validated\|fips compliant\|never leaves the enclave" docs/; then
            echo "::error::Found banned security phrases in docs/"
            exit 1
          fi
          echo "No banned phrases found"
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit Rust dependencies for known vulnerabilities
        run: |
          echo "Scanning Rust dependencies for CVEs..."
          cargo audit --deny warnings --ignore RUSTSEC-2026-0162
          # Fails CI on actual security vulnerabilities (CVEs)
          # Info-level advisories (unmaintained crates) are reported but don't block
      - name: Validate JSON schemas
        run: |
          python3 -c "import json; json.load(open('model/schema/output_schema.json')); print('output_schema.json valid')"
          python3 -c "import json; json.load(open('model/manifest/model_manifest.json')); print('model_manifest.json valid')"
          python3 -c "import json; json.load(open('compliance/SBOM.json')); print('SBOM.json valid')"
      - name: Verify model signing scripts exist
        run: |
          test -f model/signing/sign_model.sh && echo "sign_model.sh exists"
          test -f model/signing/verify_model.sh && echo "verify_model.sh exists"

  # ───────────────────────────────────────────
  # Android NDK cross-compile check
  # ───────────────────────────────────────────
  android-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Android NDK
        uses: android-actions/setup-android@v4
      - run: sdkmanager "ndk;26.1.10909125"
      - name: Cross-compile core for Android arm64
        env:
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/26.1.10909125
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /usr/local/lib/android/sdk/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CC_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CXX_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++
          AR_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo build --release --target aarch64-linux-android -p beam-core

  # ───────────────────────────────────────────
  # iOS cross-compile check (macOS runner)
  # ───────────────────────────────────────────
  ios-cross:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Cross-compile core for iOS arm64
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          export IPHONEOS_DEPLOYMENT_TARGET=12.0
          export CFLAGS_aarch64_apple_ios="--target=arm64-apple-ios -isysroot ${SDK_PATH} -miphoneos-version-min=12.0"
          export CC_aarch64_apple_ios="$(xcrun --sdk iphoneos --find clang)"
          export AR_aarch64_apple_ios="$(xcrun --sdk iphoneos --find ar)"
          cargo build --release --target aarch64-apple-ios -p beam-core

  # ───────────────────────────────────────────
  # WASM cross-compile check
  # ───────────────────────────────────────────
  wasm-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.60"
      - name: Cross-compile core for WASM
        env:
          CFLAGS: "-fPIC"
          EMCC_WASM_OPT_FLAGS: ""
        run: cargo build --release --target wasm32-unknown-emscripten -p beam-core
