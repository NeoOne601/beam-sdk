[package]
name = "beam-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
beam-crypto = { path = "../crates/beam-crypto", features = ["pqc"] }
base64 = "0.21"
pqcrypto-dilithium = { version = "0.5.0", default-features = false, features = ["std"] }
pqcrypto-kyber = { version = "0.8.1", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3.5"
# libc: required on non-WASM for mlock/munlock (key protection, VR-6)
# and libc::time() (signing timestamp, VR-1). Optional on WASM.
libc = { version = "0.2.155", optional = true }
getrandom = { version = "0.2.15", features = ["js"] }
serde_json = { version = "1", features = ["alloc"] }
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.123"

[features]
default = ["mlock"]
mlock = ["libc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[test]]
name = "quality_gate_tests"
path = "tests/quality_gate_tests.rs"

[[test]]
name = "session_state_tests"
path = "tests/session_state_tests.rs"

[[test]]
name = "crypto_pqc_tests"
path = "tests/crypto_pqc_tests.rs"

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "crypto_bench"
harness = false

