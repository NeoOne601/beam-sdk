[package]
name = "beam-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
pqcrypto-dilithium = "0.5.0"
pqcrypto-kyber = "0.8.1"
pqcrypto-traits = "0.3.4"
libc = { version = "0.2.155", optional = true }
getrandom = { version = "0.2.15", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.92"

[features]
default = ["mlock"]
mlock = ["libc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[test]]
name = "quality_gate_tests"
path = "tests/quality_gate_tests.rs"

[[test]]
name = "session_state_tests"
path = "tests/session_state_tests.rs"

[[test]]
name = "crypto_pqc_tests"
path = "tests/crypto_pqc_tests.rs"

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "crypto_bench"
harness = false

