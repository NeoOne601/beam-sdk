[package]
name = "ajna-mcp-server"
version = "0.1.0"
edition = "2021"
description = "Ajna MCP server — expose Ajna verification as tools for AI agents"

[[bin]]
name = "ajna-mcp-server"
path = "src/main.rs"

[dependencies]
ajna-crypto = { path = "../ajna-crypto", features = ["pqc"] }
ajna-intel = { path = "../ajna-intel" }
ajna-vision = { path = "../ajna-vision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
