# Ajna backend on Render free tier (Blueprint).
# Render → New → Blueprint → point at this repo. Redis is external (Upstash):
# set DATABASE_URL, REDIS_URL, JWT_SECRET in the service's Environment.
services:
  - type: web
    name: ajna-verify
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .           # repo root — backend has path deps on crates/
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_MAX_CONNECTIONS
        value: "5"
      - key: DB_REQUIRE_TLS
        value: "true"
      - key: RUST_LOG
        value: "ajna_verify_backend=info"
      - key: DATABASE_URL
        sync: false            # Supabase Session-pooler URI (you paste this)
      - key: REDIS_URL
        sync: false            # Upstash rediss:// URL (you paste this — it's a secret)
      - key: JWT_SECRET
        sync: false            # 32-byte hex (only needed for JWT auth; see chat)
      - key: CORS_ALLOWED_ORIGINS
        value: https://ajna-platform.vercel.app
