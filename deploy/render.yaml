# Ajna backend on Render free tier (Blueprint).
# Render → New → Blueprint → point at this repo. Provisions the Axum API AND a
# free Key Value (Redis) instance — REDIS_URL is auto-wired, no secret to paste.
# You only set DATABASE_URL and (optionally) JWT_SECRET in the dashboard.
#
# Prefer your own Upstash instead? Change REDIS_URL below to `sync: false` and
# set the rediss:// URL in the dashboard — the backend supports TLS Redis.
services:
  - type: keyvalue
    name: ajna-redis
    plan: free
    ipAllowList: []            # internal-only; the API connects over Render's network
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: ajna-verify
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .           # repo root — backend has path deps on crates/
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_MAX_CONNECTIONS
        value: "5"
      - key: DB_REQUIRE_TLS
        value: "true"
      - key: RUST_LOG
        value: "ajna_verify_backend=info"
      - key: REDIS_URL
        fromService:
          name: ajna-redis
          type: keyvalue
          property: connectionString
      - key: DATABASE_URL
        sync: false            # Supabase Session-pooler URI (you paste this)
      - key: JWT_SECRET
        sync: false            # only needed for JWT bearer auth; see chat
      - key: CORS_ALLOWED_ORIGINS
        value: https://ajna-platform.vercel.app
