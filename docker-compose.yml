# Unified local stack: backend API + dashboard + Postgres + Redis.
# Strict 256MB caps per CLAUDE.md hardware limits (8GB M1 host) — keeps the
# whole stack under ~1GB so the Rust compiler isn't starved.
#
#   docker compose up --build
#   API      → http://localhost:8080
#   Dashboard→ http://localhost:5173
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://ajna:ajna@db:5432/ajna_verify?sslmode=disable
      REDIS_URL: redis://redis:6379
      DB_MAX_CONNECTIONS: "5"
      DB_REQUIRE_TLS: "false"   # local Postgres has no TLS
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      RUST_LOG: "ajna_verify_backend=info"
    depends_on: [db, redis]
    mem_limit: 256m

  dashboard:
    build: ./dashboard
    ports: ["5173:80"]
    depends_on: [api]
    mem_limit: 256m

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ajna_verify
      POSTGRES_USER: ajna
      POSTGRES_PASSWORD: ajna
    ports: ["5432:5432"]
    volumes:
      - ajna_pgdata:/var/lib/postgresql/data
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    mem_limit: 256m

volumes:
  ajna_pgdata:
